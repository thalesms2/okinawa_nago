[package]
name = "nago-tui"
description = "Modo interativo (TUI) do nago"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
image = { version = "0.25.10", default-features = false, features = ["png"] }
nago-core = { path = "../nago-core" }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
serde_json = "1.0.154"
insta = { version = "1.49.0" }
nago-testkit = { path = "../nago-testkit" }
tempfile = "3.27.0"
