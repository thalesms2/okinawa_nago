[package]
name = "nago-cli"
description = "Cortar, converter e comprimir vídeos sem perda perceptível de qualidade"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nago"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "env", "wrap_help"] }
dirs = "7.0.0"
indicatif = "0.18.6"
nago-core = { path = "../nago-core" }
nago-tui = { path = "../nago-tui" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json", "redactions"] }
nago-testkit = { path = "../nago-testkit" }
nix = { version = "0.32.0", features = ["signal", "process"] }
portable-pty = "0.9.0"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
vt100 = "0.18.1"
