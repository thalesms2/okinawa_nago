[package]
name = "nago-core"
description = "Núcleo do nago: probe, planejamento e execução de jobs do ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
dirs = "7.0.0"
humansize = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "io-util", "fs"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
which = "8.0.6"

[target."cfg(unix)".dependencies]
nix = { version = "0.32.0", features = ["signal", "process"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
nago-testkit = { path = "../nago-testkit" }
tokio-util = "0.7.20"
